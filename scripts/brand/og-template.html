<!doctype html>
<!-- Social-sharing image template (1200x630). Mirrors the site's own header/footer lockup: "WALK" orange + "FLOW" white in
     Unbounded (same faux-bold as the header), the approved tagline in Caveat (as in the footer), brand colours from globals.css.
     No logo artwork is used. Rebuild: serve this folder with the three font files next to it, open at 1200x630 and save a JPEG
     as src/app/opengraph-image.jpg (copy to twitter-image.jpg). -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Unbounded"; src: url("Unbounded-Medium-latin.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Caveat"; src: url("Caveat-Variable.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Manrope"; src: url("Manrope-Variable.woff2") format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0a0a; overflow: hidden; }
  body { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 60% at 50% 100%, rgba(255,153,28,.16), rgba(255,153,28,0) 70%); }
  .word { position: relative; font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 112px; line-height: 1; letter-spacing: .01em; }
  .word .a { color: #ff991c; } .word .b { color: #ffffff; }
  .tag { position: relative; margin-top: 34px; font-family: "Caveat", cursive; font-weight: 500; font-size: 68px; line-height: 1; color: #ffb65c; }
  .sub { position: relative; margin-top: 34px; font-family: "Manrope", sans-serif; font-weight: 600; font-size: 28px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.72); }
</style>
<div class="glow"></div>
<div class="word"><span class="a">WALK</span><span class="b">FLOW</span></div>
<div class="tag">Take the steps. Build the flow.</div>
<div class="sub">Web Design &amp; AI Automation</div>
